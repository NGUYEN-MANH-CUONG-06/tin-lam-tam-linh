<!doctype html><html><head><meta charset="utf-8"><title>Offering chicken model preview</title><style>body{margin:0;background:#e9e3d8}canvas{display:block}#status{position:absolute;top:16px;left:16px;font:14px Arial;color:#4a3524}</style></head><body><div id="status">Loading model…</div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e3d8');
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.05).texture;scene.environmentIntensity=0.35;
scene.add(new THREE.HemisphereLight(0xffffff,0x665544,1.5));
const light=new THREE.DirectionalLight(0xfff5df,3);light.position.set(-1,3,3);light.castShadow=true;light.shadow.mapSize.set(2048,2048);scene.add(light);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(5,5),new THREE.MeshStandardMaterial({color:'#b6a18b',roughness:0.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.003;ground.receiveShadow=true;scene.add(ground);
const angle=Number(new URLSearchParams(location.search).get('angle')||0);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.01,20);camera.position.set(Math.sin(angle)*1.6,0.9,Math.cos(angle)*1.6);camera.lookAt(0,0.22,0);
try{const gltf=await new GLTFLoader().loadAsync('/models/offering-chicken.glb');const model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(model);renderer.render(scene,camera);document.getElementById('status').textContent='3MF sculpt • fixed world transform';window.__preview={ready:true,model,scene,camera,renderer};}catch(error){document.getElementById('status').textContent=String(error);window.__preview={error:String(error)};}
</script></body></html>
